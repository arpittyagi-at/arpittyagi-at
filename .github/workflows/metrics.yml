name: GitHub profile metrics

on:
  schedule:
    - cron: "42 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-profile-metrics
  cancel-in-progress: true

jobs:
  metrics:
    name: Build profile metrics SVG
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Generate github-metrics.svg
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          user: ${{ github.repository_owner }}
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          config_display: large
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: programming, markup, data
          plugin_languages_sections: most-used
          plugin_lines: yes
          plugin_stars: yes
          plugin_followup: yes
