  <circle cx="76" cy="294" r="95" fill="#FF9900" fill-opacity="0.12"/>

  <g filter="url(#shadow)">
    <rect x="58" y="48" width="244" height="264" rx="36" fill="url(#base)"/>
    <rect x="78" y="72" width="204" height="216" rx="28" fill="url(#glass)" stroke="#F0F6FC" stroke-opacity="0.18"/>
  </g>

  <circle cx="180" cy="130" r="48" fill="#F0F6FC"/>
